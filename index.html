<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Jonas' Game of Life</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#121722;--line:#293243;--text:#f5f7fb;--muted:#9ca8ba;--alive:#67e8f9;--accent:#8b5cf6;--danger:#ef4444}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;overscroll-behavior:none}body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:1000px;margin:auto;padding:10px;display:grid;gap:9px}.top{display:flex;gap:10px;align-items:end;justify-content:space-between;flex-wrap:wrap}h1{font-size:clamp(20px,5vw,30px);margin:0}.hint{font-size:13px;color:var(--muted)}.stats{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}.run-status{margin-top:3px;color:var(--text)}.pattern-badges{margin-top:5px;display:flex;justify-content:flex-end;gap:5px;min-height:30px;flex-wrap:wrap}.pattern-badge{position:relative;width:30px;height:30px;border:1px solid var(--line);background:var(--panel);border-radius:8px;display:grid;place-items:center}.pattern-badge .count{position:absolute;right:-5px;top:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--accent);color:white;font-size:10px;font-weight:700;display:grid;place-items:center}.pattern-empty{font-size:13px;color:var(--muted)}.pattern-icon{width:24px;height:24px;display:block;overflow:visible}.pattern-icon rect{fill:var(--alive)}.board{width:100%;height:min(61dvh,650px);min-height:330px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#05070a;touch-action:none}.board.running{border-color:var(--accent)}canvas{width:100%;height:100%;display:block;touch-action:none}.controls{display:grid;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit}button,select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 13px;min-height:44px}button.primary{background:var(--accent);border-color:var(--accent);font-weight:700}button:disabled{opacity:.45}label{display:flex;align-items:center;gap:8px;color:var(--muted)}input[type=range]{width:min(220px,42vw)}.rule{padding:9px 11px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--muted)}.rule input{width:68px;background:#090b10;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px}#error{display:none;border:1px solid var(--danger);background:#2a1012;color:#fecaca;border-radius:10px;padding:10px;font-size:14px}#error.show{display:block}.radial-layer{position:fixed;inset:0;z-index:50;pointer-events:none}.radial-launcher,.radial-item{position:fixed;border-radius:50%;padding:0;display:grid;place-items:center;pointer-events:auto;box-shadow:0 5px 20px #0008;transition:transform .16s ease,opacity .16s ease,background .16s ease}.radial-launcher{width:54px;height:54px;background:var(--accent);border-color:#b8a1ff;z-index:2}.radial-launcher.running{opacity:.4}.radial-item{width:46px;height:46px;background:#141a25;border:1px solid #354055;opacity:0;transform:scale(.35);pointer-events:none}.radial-layer.open .radial-item{opacity:1;transform:scale(1);pointer-events:auto}.radial-item.selected{outline:2px solid var(--alive);outline-offset:2px}.radial-item .pattern-icon{width:28px;height:28px}.draw-icon{width:27px;height:27px;fill:none;stroke:var(--alive);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.radial-item .draw-icon{width:25px;height:25px}.tool-label{position:fixed;z-index:51;pointer-events:none;background:#090b10e8;border:1px solid var(--line);border-radius:7px;padding:4px 7px;color:var(--text);font-size:11px;opacity:0;transition:opacity .1s}.tool-label.show{opacity:1}@media(max-width:600px){main{padding:7px}.board{height:52dvh;min-height:315px}.row.main-actions button{flex:1}.rule{width:100%;display:flex;justify-content:space-between;align-items:center}.stats{text-align:left}.pattern-badges{justify-content:flex-start}}
</style></head><body><main>
<div class="top"><div><h1>Jonas' Game of Life</h1><div class="hint" id="hint">Draw cells, or open the pattern button and choose a shape.</div></div><div class="stats"><div><span id="generation">Gen 0</span> · <span id="population">0 alive</span></div><div class="run-status" id="runStatus" aria-live="polite">Ready</div><div class="pattern-badges" id="patterns" aria-live="polite"><span class="pattern-empty">No known patterns</span></div></div></div>
<div id="error" role="alert" aria-live="assertive"></div>
<div class="board" id="board"><canvas id="life"></canvas></div>
<div class="controls"><div class="row main-actions"><button class="primary" id="play">▶ Play</button><button id="step">Step</button><button id="random">Random</button><button id="clear">Clear</button></div>
<div class="row"><label>Rule <select id="preset"><option value="3/23">Conway's Life — B3/S23</option><option value="36/23">HighLife — B36/S23</option><option value="2/">Seeds — B2/S</option><option value="3678/34678">Day & Night — B3678/S34678</option><option value="3/012345678">Life Without Death</option><option value="3/12345">Maze — B3/S12345</option><option value="custom">Custom</option></select></label><span class="rule">B <input id="birth" value="3" inputmode="numeric" aria-label="Birth rule"> / S <input id="survive" value="23" inputmode="numeric" aria-label="Survival rule"></span></div>
<div class="row"><label>Speed <input id="speed" type="range" min="1" max="30" value="8"><span id="speedText">8/s</span></label><label>Cell size <input id="cellSize" type="range" min="7" max="24" value="14"></label></div></div></main>
<div class="radial-layer" id="radialLayer" aria-label="Pattern toolbox"><button class="radial-launcher" id="radialLauncher" type="button" aria-label="Open pattern toolbox" aria-expanded="false"></button></div><div class="tool-label" id="toolLabel"></div>
<script type="module">
import {findRepeatPeriod,nextGeneration,population,parseRule} from './life.mjs';
import {recognizePatterns} from './patterns.mjs';
import {TOOLBOX_PATTERNS,placePattern} from './toolbox.mjs';
import {radialLayout} from './radial.mjs';
const log=(...a)=>console.log('[GameOfLife]',...a),logError=(c,e)=>console.error('[GameOfLife]',c,e),q=s=>document.querySelector(s);
const canvas=q('#life'),ctx=canvas.getContext('2d'),playBtn=q('#play'),genEl=q('#generation'),popEl=q('#population'),preset=q('#preset'),birthInput=q('#birth'),surviveInput=q('#survive'),speed=q('#speed'),speedText=q('#speedText'),cellSizeInput=q('#cellSize'),board=q('#board'),hint=q('#hint'),runStatus=q('#runStatus'),patternsEl=q('#patterns'),errorBox=q('#error'),radialLayer=q('#radialLayer'),radialLauncher=q('#radialLauncher'),toolLabel=q('#toolLabel');
if(!ctx)throw new Error('Canvas 2D is not supported by this browser');
let cell=14,cols=0,rows=0,grid=new Uint8Array(),generation=0,running=false,last=0,drawing=false,paintValue=1,lastPaint='',runGenerations=0,recentStates=[],lastPatternSummary='',selectedTool='Draw',radialOpen=false;
const key=(x,y)=>y*cols+x,patternByName=new Map(TOOLBOX_PATTERNS.map(p=>[p.name,p]));
function drawIcon(){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 40 40');s.classList.add('draw-icon');s.innerHTML='<path d="M9 31L12 23L28 7L33 12L17 28Z"/><path d="M12 23L17 28"/>';return s}
function patternIcon(name){const p=patternByName.get(name);if(!p)return drawIcon();const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox',`-0.6 -0.6 ${p.width+1.2} ${p.height+1.2}`);s.setAttribute('preserveAspectRatio','xMidYMid meet');s.classList.add('pattern-icon');for(const[x,y]of p.points){const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',x+.08);r.setAttribute('y',y+.08);r.setAttribute('width','.84');r.setAttribute('height','.84');r.setAttribute('rx','.08');s.append(r)}return s}
function showError(context,error){running=false;drawing=false;closeRadial();playBtn.textContent='▶ Play';board.classList.remove('running');radialLauncher.classList.remove('running');hint.textContent='Paused because something broke.';runStatus.textContent=`Stopped after ${runGenerations} this run`;const msg=error instanceof Error?error.message:String(error);errorBox.textContent=`Something broke: ${context}. ${msg}`;errorBox.classList.add('show');logError(context,error)}function clearError(){errorBox.textContent='';errorBox.classList.remove('show')}
window.addEventListener('error',e=>showError('unexpected browser error',e.error??e.message));window.addEventListener('unhandledrejection',e=>showError('unexpected promise error',e.reason));
function makeGrid(c,r,old,oc,or){const n=new Uint8Array(c*r),mc=Math.min(oc,c),mr=Math.min(or,r);for(let y=0;y<mr;y++)for(let x=0;x<mc;x++)n[y*c+x]=old[y*oc+x];return n}
function positionLauncher(){const b=board.getBoundingClientRect(),size=54,left=Math.max(8,Math.min(innerWidth-size-8,b.right-size-14)),top=Math.max(8,Math.min(innerHeight-size-8,b.bottom-size-14));radialLauncher.style.left=`${left}px`;radialLauncher.style.top=`${top}px`;if(radialOpen)layoutRadial()}
function layoutRadial(){const items=[...radialLayer.querySelectorAll('.radial-item')],r=radialLauncher.getBoundingClientRect(),ax=r.left+r.width/2,ay=r.top+r.height/2,pos=radialLayout(items.length,ax,ay,innerWidth,innerHeight);items.forEach((b,i)=>{b.style.left=`${ax+pos[i].x-23}px`;b.style.top=`${ay+pos[i].y-23}px`})}
function closeRadial(){radialOpen=false;radialLayer.classList.remove('open');radialLauncher.setAttribute('aria-expanded','false');toolLabel.classList.remove('show')}
function toggleRadial(){if(running)return;radialOpen=!radialOpen;radialLayer.classList.toggle('open',radialOpen);radialLauncher.setAttribute('aria-expanded',String(radialOpen));if(radialOpen)layoutRadial()}
function updateLauncherIcon(){radialLauncher.replaceChildren(selectedTool==='Draw'?drawIcon():patternIcon(selectedTool));radialLauncher.setAttribute('aria-label',`Pattern toolbox. Current tool: ${selectedTool}`);for(const b of radialLayer.querySelectorAll('.radial-item'))b.classList.toggle('selected',b.dataset.tool===selectedTool)}
function selectTool(name){selectedTool=name;updateLauncherIcon();closeRadial();hint.textContent=name==='Draw'?'Draw cells with your finger, then press Play.':`${name} selected — tap the board to place it.`;log('tool selected',name)}
function buildRadial(){const tools=['Draw',...TOOLBOX_PATTERNS.map(p=>p.name)];for(const name of tools){const b=document.createElement('button');b.type='button';b.className='radial-item';b.dataset.tool=name;b.setAttribute('aria-label',name);b.title=name;b.append(name==='Draw'?drawIcon():patternIcon(name));b.addEventListener('click',()=>{if(!running)selectTool(name)});b.addEventListener('pointerenter',()=>showToolLabel(b,name));b.addEventListener('focus',()=>showToolLabel(b,name));b.addEventListener('pointerleave',()=>toolLabel.classList.remove('show'));b.addEventListener('blur',()=>toolLabel.classList.remove('show'));radialLayer.append(b)}updateLauncherIcon();radialLauncher.addEventListener('click',toggleRadial)}
function showToolLabel(button,name){const r=button.getBoundingClientRect();toolLabel.textContent=name;toolLabel.style.left=`${Math.max(6,Math.min(innerWidth-toolLabel.offsetWidth-6,r.left+r.width/2-30))}px`;toolLabel.style.top=`${Math.max(6,r.top-28)}px`;toolLabel.classList.add('show')}
function resize(){try{const rect=board.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);if(rect.width<1||rect.height<1)return;canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const old=grid,oc=cols,or=rows,c=Math.max(1,Math.floor(rect.width/cell)),rr=Math.max(1,Math.floor(rect.height/cell));grid=makeGrid(c,rr,old,oc,or);cols=c;rows=rr;draw();positionLauncher()}catch(e){showError('resizing the board',e)}}
function isConway(){return [...parseRule(birthInput.value)].sort().join('')==='3'&&[...parseRule(surviveInput.value)].sort().join('')==='23'}
function updatePatternDisplay(){patternsEl.replaceChildren();if(!isConway()){const e=document.createElement('span');e.className='pattern-empty';e.textContent='Pattern names are Conway-only';patternsEl.append(e);lastPatternSummary='';return}const m=recognizePatterns(grid,cols,rows),s=JSON.stringify(m);if(!m.length){const e=document.createElement('span');e.className='pattern-empty';e.textContent='No known patterns';patternsEl.append(e)}else for(const{name,count}of m){const badge=document.createElement('span');badge.className='pattern-badge';badge.title=`${count} × ${name}`;badge.setAttribute('aria-label',`${count} ${name}${count===1?'':'s'}`);badge.append(patternIcon(name));if(count>1){const c=document.createElement('span');c.className='count';c.textContent=count;badge.append(c)}patternsEl.append(badge)}if(s!==lastPatternSummary){if(m.length)log('patterns recognized',m);lastPatternSummary=s}}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.fillStyle='#05070a';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#18202c';ctx.beginPath();for(let x=0;x<=cols;x++){ctx.moveTo(x*cell+.5,0);ctx.lineTo(x*cell+.5,rows*cell)}for(let y=0;y<=rows;y++){ctx.moveTo(0,y*cell+.5);ctx.lineTo(cols*cell,y*cell+.5)}ctx.stroke();ctx.fillStyle='#67e8f9';for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(grid[key(x,y)])ctx.fillRect(x*cell+1,y*cell+1,cell-1,cell-1);genEl.textContent=`Gen ${generation}`;popEl.textContent=`${population(grid)} alive`;updatePatternDisplay()}
function stopRun(reason,period=0){running=false;drawing=false;playBtn.textContent='▶ Play';board.classList.remove('running');radialLauncher.classList.remove('running');hint.textContent=selectedTool==='Draw'?'Stopped. You can draw again.':`${selectedTool} selected — tap to place.`;runStatus.textContent=reason==='repeat'?`Stopped: repeats every ${period} generation${period===1?'':'s'} · ${runGenerations} this run`:`Paused · ${runGenerations} generation${runGenerations===1?'':'s'} this run`;log('simulation stopped',{reason,period,runGenerations,generation})}
function startRun(){clearError();closeRadial();parseRule(birthInput.value);parseRule(surviveInput.value);running=true;drawing=false;runGenerations=0;recentStates=[grid.slice()];last=performance.now();playBtn.textContent='⏸ Pause';board.classList.add('running');radialLauncher.classList.add('running');hint.textContent='Running — pause before editing.';runStatus.textContent='Running · 0 generations this run';log('simulation started',{generation,population:population(grid)})}
function tick(track=false){try{grid=nextGeneration(grid,cols,rows,birthInput.value,surviveInput.value);generation++;if(track){runGenerations++;const period=findRepeatPeriod(grid,recentStates,3);recentStates.push(grid.slice());if(recentStates.length>3)recentStates.shift();runStatus.textContent=`Running · ${runGenerations} generation${runGenerations===1?'':'s'} this run`;draw();if(period)stopRun('repeat',period)}else draw()}catch(e){showError('calculating next generation',e)}}function loop(t){if(running&&t-last>=1000/+speed.value){tick(true);last=t}requestAnimationFrame(loop)}
function point(e){const r=canvas.getBoundingClientRect();return[Math.floor((e.clientX-r.left)/cell),Math.floor((e.clientY-r.top)/cell)]}function paint(e){const[x,y]=point(e);if(x<0||y<0||x>=cols||y>=rows)return;const k=key(x,y);if(k===lastPaint)return;grid[k]=paintValue;lastPaint=k;draw()}
canvas.addEventListener('pointerdown',e=>{try{e.preventDefault();if(running)return;closeRadial();const[x,y]=point(e);if(selectedTool!=='Draw'){const p=patternByName.get(selectedTool);if(!p)throw new Error(`Unknown selected pattern: ${selectedTool}`);const placed=placePattern(grid,cols,rows,p,x-Math.floor(p.width/2),y-Math.floor(p.height/2));generation=0;runGenerations=0;recentStates=[];draw();runStatus.textContent=`Placed ${selectedTool}`;log('pattern placed',{name:selectedTool,placed,x,y});return}canvas.setPointerCapture(e.pointerId);drawing=true;lastPaint='';if(x>=0&&y>=0&&x<cols&&y<rows)paintValue=grid[key(x,y)]?0:1;paint(e)}catch(err){showError('editing the board',err)}});canvas.addEventListener('pointermove',e=>{if(drawing&&!running&&selectedTool==='Draw')paint(e)});canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);
playBtn.addEventListener('click',()=>{try{running?stopRun('manual'):startRun()}catch(e){showError('starting simulation',e)}});q('#step').addEventListener('click',()=>{if(!running)tick(false)});q('#clear').addEventListener('click',()=>{grid.fill(0);generation=0;running=false;runGenerations=0;recentStates=[];playBtn.textContent='▶ Play';board.classList.remove('running');radialLauncher.classList.remove('running');runStatus.textContent='Ready';draw();log('board cleared')});q('#random').addEventListener('click',()=>{if(running)return;for(let i=0;i<grid.length;i++)grid[i]=Math.random()<.22?1:0;generation=0;runGenerations=0;recentStates=[];runStatus.textContent='Ready';draw();log('random board generated')});preset.addEventListener('change',()=>{if(preset.value!=='custom')[birthInput.value,surviveInput.value]=preset.value.split('/');draw()});[birthInput,surviveInput].forEach(i=>i.addEventListener('input',()=>{i.value=i.value.replace(/[^0-8]/g,'');preset.value='custom';draw()}));speed.addEventListener('input',()=>speedText.textContent=`${speed.value}/s`);cellSizeInput.addEventListener('input',()=>{if(!running){cell=+cellSizeInput.value;resize()}});addEventListener('resize',positionLauncher);addEventListener('scroll',positionLauncher,{passive:true});
try{buildRadial();new ResizeObserver(resize).observe(board);requestAnimationFrame(loop);log('app initialized')}catch(e){showError('starting app',e)}
</script></body></html>
