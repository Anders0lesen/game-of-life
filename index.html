<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Jonas' Game of Life</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#121722;--line:#293243;--text:#f5f7fb;--muted:#9ca8ba;--alive:#67e8f9;--accent:#8b5cf6;--danger:#ef4444;--survive:#22c55e;--die:#ef4444;--born:#67e8f9}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;overscroll-behavior:none}body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:1000px;margin:auto;padding:10px;display:grid;gap:9px}.top{height:88px;display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,42%);gap:10px;align-items:start}.title-line{display:flex;align-items:baseline;gap:8px;white-space:nowrap}h1{font-size:clamp(20px,5vw,30px);margin:0}.version{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.status-stack{height:88px;display:grid;grid-template-rows:24px 20px 36px;justify-items:end;color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden}.run-status{color:var(--text);width:100%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats-line{font-size:13px;white-space:nowrap}.pattern-badges{height:34px;display:flex;justify-content:flex-end;gap:5px;flex-wrap:nowrap;overflow:hidden;visibility:hidden}.pattern-badges.has-patterns{visibility:visible}.pattern-badge{position:relative;flex:0 0 30px;width:30px;height:30px;border:1px solid var(--line);background:var(--panel);border-radius:8px;display:grid;place-items:center}.pattern-badge .count{position:absolute;right:-4px;top:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--accent);color:white;font-size:10px;font-weight:700;display:grid;place-items:center}.pattern-icon{width:24px;height:24px;display:block;overflow:visible}.pattern-icon rect{fill:var(--alive)}.board{width:100%;height:min(66dvh,700px);min-height:350px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#05070a;touch-action:none}.board.running{border-color:var(--accent)}canvas{width:100%;height:100%;display:block;touch-action:none}.controls{display:grid;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit}button,select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 13px;min-height:44px}button.primary{background:var(--accent);border-color:var(--accent);font-weight:700}button:disabled{opacity:.45}label{display:flex;align-items:center;gap:8px;color:var(--muted)}input[type=range]{width:min(220px,42vw)}.rule{padding:9px 11px;background:#090b10;border:1px solid var(--line);border-radius:10px;color:var(--muted)}.rule input{width:68px;background:#090b10;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px}.fate-legend{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;flex-wrap:wrap}.fate-key{display:flex;gap:5px;align-items:center}.fate-dot{width:10px;height:10px;border-radius:2px}.fate-dot.survive{background:var(--survive)}.fate-dot.die{background:var(--die)}.fate-dot.born{background:var(--born);opacity:.55}.settings{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:40}.settings summary{list-style:none;width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:11px;background:var(--panel);display:grid;place-items:center;cursor:pointer;font-size:21px;box-shadow:0 5px 20px #0008}.settings summary::-webkit-details-marker{display:none}.settings-panel{position:absolute;right:0;top:50px;width:min(92vw,390px);padding:12px;border:1px solid var(--line);border-radius:12px;background:#0d1119f7;box-shadow:0 12px 35px #000b;display:grid;gap:11px}.settings-panel .row{display:grid;gap:9px}.settings-panel label{justify-content:space-between}.settings-panel select{max-width:255px}.settings-panel input[type=range]{width:180px}#error{display:none;border:1px solid var(--danger);background:#2a1012;color:#fecaca;border-radius:10px;padding:10px;font-size:14px}#error.show{display:block}.radial-layer{position:fixed;inset:0;z-index:50;pointer-events:none}.radial-launcher,.radial-item{position:fixed;border-radius:50%;padding:0;display:grid;place-items:center;pointer-events:auto;box-shadow:0 5px 20px #0008;transition:transform .16s ease,opacity .16s ease,background .16s ease}.radial-launcher{width:54px;height:54px;background:var(--accent);border-color:#b8a1ff;z-index:2}.radial-launcher.running{opacity:.4}.radial-item{width:46px;height:46px;background:#141a25;border:1px solid #354055;opacity:0;transform:scale(.35);pointer-events:none}.radial-layer.open .radial-item{opacity:1;transform:scale(1);pointer-events:auto}.radial-item.selected{outline:2px solid var(--alive);outline-offset:2px}.radial-item .pattern-icon{width:28px;height:28px}.draw-icon{width:27px;height:27px;fill:none;stroke:var(--alive);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.radial-item .draw-icon{width:25px;height:25px}.tool-label{position:fixed;z-index:51;pointer-events:none;background:#090b10e8;border:1px solid var(--line);border-radius:7px;padding:4px 7px;color:var(--text);font-size:11px;opacity:0;transition:opacity .1s}.tool-label.show{opacity:1}@media(max-width:600px){main{padding:7px;padding-top:58px}.top{height:82px;grid-template-columns:minmax(0,1fr) 145px}.status-stack{height:82px;grid-template-rows:22px 20px 34px}.title-line{white-space:normal;line-height:1.05}.board{height:58dvh;min-height:330px}.row.main-actions button{flex:1}.settings-panel input[type=range]{width:150px}}
</style></head><body>
<details class="settings"><summary aria-label="Game settings" title="Settings">⚙</summary><div class="settings-panel"><div class="row"><label>Rule <select id="preset"><option value="3/23">Conway's Life — B3/S23</option><option value="36/23">HighLife — B36/S23</option><option value="2/">Seeds — B2/S</option><option value="3678/34678">Day & Night — B3678/S34678</option><option value="3/012345678">Life Without Death</option><option value="3/12345">Maze — B3/S12345</option><option value="custom">Custom</option></select></label><span class="rule">B <input id="birth" value="3" inputmode="numeric" aria-label="Birth rule"> / S <input id="survive" value="23" inputmode="numeric" aria-label="Survival rule"></span></div><div class="row"><label>Speed <span><input id="speed" type="range" min="1" max="30" value="8"> <span id="speedText">8/s</span></span></label><label>Cell size <input id="cellSize" type="range" min="4" max="24" value="14"></label></div><div class="fate-legend"><span class="fate-key"><span class="fate-dot survive"></span>survives</span><span class="fate-key"><span class="fate-dot die"></span>dies next</span><span class="fate-key"><span class="fate-dot born"></span>born next</span></div></div></details>
<main><div class="top"><div class="title-line"><h1>Jonas' Game of Life</h1><span class="version">v0.4.1</span></div><div class="status-stack"><div class="run-status" id="runStatus">Ready</div><div class="stats-line"><span id="generation">Gen 0</span> · <span id="population">0 alive</span></div><div class="pattern-badges" id="patterns"></div></div></div><div id="error"></div><div class="board" id="board"><canvas id="life"></canvas></div><div class="controls"><div class="row main-actions"><button class="primary" id="play">▶ Play</button><button id="step">Step</button><button id="random">Random</button><button id="clear">Clear</button></div></div></main>
<div class="radial-layer" id="radialLayer"><button class="radial-launcher" id="radialLauncher" type="button"></button></div><div class="tool-label" id="toolLabel"></div>
<script type="module">
import {CELL_FATE,classifyCellFates,findRepeatPeriod,nextGeneration,population,parseRule} from './life.mjs';import {recognizePatterns} from './patterns.mjs';import {TOOLBOX_PATTERNS,placePattern} from './toolbox.mjs';import {radialLayout} from './radial.mjs';
const q=s=>document.querySelector(s),canvas=q('#life'),ctx=canvas.getContext('2d'),playBtn=q('#play'),genEl=q('#generation'),popEl=q('#population'),preset=q('#preset'),birthInput=q('#birth'),surviveInput=q('#survive'),speed=q('#speed'),speedText=q('#speedText'),cellSizeInput=q('#cellSize'),board=q('#board'),runStatus=q('#runStatus'),patternsEl=q('#patterns'),errorBox=q('#error'),radialLayer=q('#radialLayer'),radialLauncher=q('#radialLauncher'),toolLabel=q('#toolLabel');let cell=14,cols=0,rows=0,grid=new Uint8Array(),generation=0,running=false,last=0,drawing=false,paintValue=1,lastPaint='',runGenerations=0,recentStates=[],lastPatternSummary='',selectedTool='Draw',radialOpen=false;const key=(x,y)=>y*cols+x,patternByName=new Map(TOOLBOX_PATTERNS.map(p=>[p.name,p]));
function drawIcon(){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 40 40');s.classList.add('draw-icon');s.innerHTML='<path d="M9 31L12 23L28 7L33 12L17 28Z"/><path d="M12 23L17 28"/>';return s}function patternIcon(name){const p=patternByName.get(name);if(!p)return drawIcon();const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox',`-.6 -.6 ${p.width+1.2} ${p.height+1.2}`);s.classList.add('pattern-icon');for(const[x,y]of p.points){const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',x+.08);r.setAttribute('y',y+.08);r.setAttribute('width','.84');r.setAttribute('height','.84');s.append(r)}return s}
function closeRadial(){radialOpen=false;radialLayer.classList.remove('open');toolLabel.classList.remove('show')}function layoutRadial(){const items=[...radialLayer.querySelectorAll('.radial-item')],r=radialLauncher.getBoundingClientRect(),ax=r.left+r.width/2,ay=r.top+r.height/2,pos=radialLayout(items.length,ax,ay,innerWidth,innerHeight);items.forEach((b,i)=>{b.style.left=`${ax+pos[i].x-23}px`;b.style.top=`${ay+pos[i].y-23}px`})}function positionLauncher(){const b=board.getBoundingClientRect();radialLauncher.style.left=`${Math.max(8,Math.min(innerWidth-62,b.right-68))}px`;radialLauncher.style.top=`${Math.max(8,Math.min(innerHeight-62,b.bottom-68))}px`;if(radialOpen)layoutRadial()}function updateLauncherIcon(){radialLauncher.replaceChildren(selectedTool==='Draw'?drawIcon():patternIcon(selectedTool));for(const b of radialLayer.querySelectorAll('.radial-item'))b.classList.toggle('selected',b.dataset.tool===selectedTool)}function selectTool(n){selectedTool=n;updateLauncherIcon();closeRadial()}function buildRadial(){for(const n of ['Draw',...TOOLBOX_PATTERNS.map(p=>p.name)]){const b=document.createElement('button');b.type='button';b.className='radial-item';b.dataset.tool=n;b.title=n;b.append(n==='Draw'?drawIcon():patternIcon(n));b.onclick=()=>{if(!running)selectTool(n)};b.onpointerenter=()=>{const r=b.getBoundingClientRect();toolLabel.textContent=n;toolLabel.style.left=`${r.left}px`;toolLabel.style.top=`${Math.max(4,r.top-28)}px`;toolLabel.classList.add('show')};b.onpointerleave=()=>toolLabel.classList.remove('show');radialLayer.append(b)}updateLauncherIcon();radialLauncher.onclick=()=>{if(running)return;radialOpen=!radialOpen;radialLayer.classList.toggle('open',radialOpen);if(radialOpen)layoutRadial()}}
function makeGrid(c,r,old,oc,or){const n=new Uint8Array(c*r);for(let y=0;y<Math.min(or,r);y++)for(let x=0;x<Math.min(oc,c);x++)n[y*c+x]=old[y*oc+x];return n}function resize(){const rect=board.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),old=grid,oc=cols,or=rows;canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);cols=Math.max(1,Math.floor(rect.width/cell));rows=Math.max(1,Math.floor(rect.height/cell));grid=makeGrid(cols,rows,old,oc,or);draw();positionLauncher()}function isConway(){return [...parseRule(birthInput.value)].sort().join('')==='3'&&[...parseRule(surviveInput.value)].sort().join('')==='23'}function updatePatternDisplay(){patternsEl.replaceChildren();patternsEl.classList.remove('has-patterns');if(!isConway())return;const m=recognizePatterns(grid,cols,rows);if(m.length){patternsEl.classList.add('has-patterns');for(const{name,count}of m){const badge=document.createElement('span');badge.className='pattern-badge';badge.title=`${count} × ${name}`;badge.append(patternIcon(name));if(count>1){const c=document.createElement('span');c.className='count';c.textContent=count;badge.append(c)}patternsEl.append(badge)}}}function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.fillStyle='#05070a';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#18202c';ctx.beginPath();for(let x=0;x<=cols;x++){ctx.moveTo(x*cell+.5,0);ctx.lineTo(x*cell+.5,rows*cell)}for(let y=0;y<=rows;y++){ctx.moveTo(0,y*cell+.5);ctx.lineTo(cols*cell,y*cell+.5)}ctx.stroke();const f=classifyCellFates(grid,cols,rows,birthInput.value,surviveInput.value);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const z=f[key(x,y)];if(z===CELL_FATE.DEAD)continue;ctx.fillStyle=z===CELL_FATE.SURVIVES?'#22c55e':z===CELL_FATE.DIES?'#ef4444':'rgba(103,232,249,.42)';ctx.fillRect(x*cell+1,y*cell+1,cell-1,cell-1)}genEl.textContent=`Gen ${generation}`;popEl.textContent=`${population(grid)} alive`;updatePatternDisplay()}
function stopRun(reason,period=0){running=false;drawing=false;playBtn.textContent='▶ Play';board.classList.remove('running');radialLauncher.classList.remove('running');runStatus.textContent=reason==='repeat'?`Stopped · period ${period} · ${runGenerations} gens`:`Paused · ${runGenerations} gens`}function startRun(){closeRadial();running=true;runGenerations=0;recentStates=[grid.slice()];last=performance.now();playBtn.textContent='⏸ Pause';board.classList.add('running');radialLauncher.classList.add('running');runStatus.textContent='Running · 0 gens'}function tick(track=false){grid=nextGeneration(grid,cols,rows,birthInput.value,surviveInput.value);generation++;if(track){runGenerations++;const p=findRepeatPeriod(grid,recentStates,3);recentStates.push(grid.slice());if(recentStates.length>3)recentStates.shift();runStatus.textContent=`Running · ${runGenerations} gens`;draw();if(p)stopRun('repeat',p)}else draw()}function loop(t){if(running&&t-last>=1000/+speed.value){tick(true);last=t}requestAnimationFrame(loop)}function point(e){const r=canvas.getBoundingClientRect();return[Math.floor((e.clientX-r.left)/cell),Math.floor((e.clientY-r.top)/cell)]}function paint(e){const[x,y]=point(e);if(x<0||y<0||x>=cols||y>=rows)return;const k=key(x,y);if(k===lastPaint)return;grid[k]=paintValue;lastPaint=k;draw()}
canvas.onpointerdown=e=>{e.preventDefault();if(running)return;closeRadial();const[x,y]=point(e);if(selectedTool!=='Draw'){const p=patternByName.get(selectedTool);placePattern(grid,cols,rows,p,x-Math.floor(p.width/2),y-Math.floor(p.height/2));generation=0;runGenerations=0;recentStates=[];draw();runStatus.textContent=`Placed ${selectedTool}`;return}canvas.setPointerCapture(e.pointerId);drawing=true;lastPaint='';if(x>=0&&y>=0&&x<cols&&y<rows)paintValue=grid[key(x,y)]?0:1;paint(e)};canvas.onpointermove=e=>{if(drawing&&!running&&selectedTool==='Draw')paint(e)};canvas.onpointerup=()=>drawing=false;playBtn.onclick=()=>running?stopRun('manual'):startRun();q('#step').onclick=()=>{if(!running)tick()};q('#clear').onclick=()=>{grid.fill(0);generation=0;running=false;runGenerations=0;recentStates=[];playBtn.textContent='▶ Play';board.classList.remove('running');radialLauncher.classList.remove('running');runStatus.textContent='Ready';draw()};q('#random').onclick=()=>{if(running)return;for(let i=0;i<grid.length;i++)grid[i]=Math.random()<.22;generation=0;runGenerations=0;recentStates=[];runStatus.textContent='Ready';draw()};preset.onchange=()=>{if(preset.value!=='custom')[birthInput.value,surviveInput.value]=preset.value.split('/');draw()};[birthInput,surviveInput].forEach(i=>i.oninput=()=>{i.value=i.value.replace(/[^0-8]/g,'');preset.value='custom';draw()});speed.oninput=()=>speedText.textContent=`${speed.value}/s`;cellSizeInput.oninput=()=>{if(!running){cell=+cellSizeInput.value;resize()}};addEventListener('resize',positionLauncher);addEventListener('scroll',positionLauncher,{passive:true});buildRadial();new ResizeObserver(resize).observe(board);requestAnimationFrame(loop);
</script></body></html>
