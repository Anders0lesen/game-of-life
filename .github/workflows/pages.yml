name: Test and deploy GitHub Pages

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test + build deploy artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show run context
        shell: bash
        run: |
          set -x
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "repository=${{ github.repository }}"
          pwd
          find . -maxdepth 3 -type f -not -path './.git/*' | sort

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          node --test tests/*.test.mjs 2>&1 | tee test-output.log

      - name: Validate enhancement JavaScript
        run: node --check ui-enhancements.js

      - name: Build exact Pages artifact
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf _site
          mkdir _site
          cp index.html life.mjs patterns.mjs toolbox.mjs radial.mjs ui-enhancements.js _site/
          python - <<'PY'
          from pathlib import Path
          path = Path('_site/index.html')
          text = path.read_text(encoding='utf-8')
          needle = '<script type="module">'
          if needle not in text:
              raise SystemExit('ERROR: module-script insertion point not found')
          text = text.replace(needle, '<script src="./ui-enhancements.js"></script>\n<script type="module">', 1)
          path.write_text(text, encoding='utf-8')
          PY
          printf '%s\n' "$GITHUB_SHA" > _site/DEPLOYED_COMMIT.txt

      - name: Validate deployable artifact
        shell: bash
        run: |
          set -euxo pipefail
          for file in index.html life.mjs patterns.mjs toolbox.mjs radial.mjs ui-enhancements.js DEPLOYED_COMMIT.txt; do
            test -s "_site/$file" || { echo "ERROR: required deploy file missing or empty: $file"; exit 1; }
          done
          grep -q 'type="module"' _site/index.html || { echo 'ERROR: built index has no module script'; exit 1; }
          grep -q 'ui-enhancements.js' _site/index.html || { echo 'ERROR: built index does not load UI enhancements'; exit 1; }
          grep -q 'v0.4.2' _site/ui-enhancements.js || { echo 'ERROR: expected visible version marker missing'; exit 1; }
          grep -q 'colorMode' _site/ui-enhancements.js || { echo 'ERROR: color selector missing'; exit 1; }
          test "$(cat _site/DEPLOYED_COMMIT.txt)" = "$GITHUB_SHA"

      - name: Upload exact Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          echo '## CI FAILED' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: ${{ github.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-output.log ]; then
            echo '### Test output' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 test-output.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Success summary
        if: success()
        run: |
          echo '## CI PASSED' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit ${{ github.sha }} passed tests and produced the deploy artifact." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy exact tested artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment failure summary
        if: failure()
        run: |
          echo '## PAGES DEPLOY FAILED' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment success summary
        if: success()
        run: |
          echo '## PAGES DEPLOYED' >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
