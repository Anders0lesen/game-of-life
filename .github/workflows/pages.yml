name: Test and deploy GitHub Pages

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test + diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show run context
        shell: bash
        run: |
          set -x
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "repository=${{ github.repository }}"
          pwd
          find . -maxdepth 3 -type f -not -path './.git/*' | sort

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          node --test tests/*.test.mjs 2>&1 | tee test-output.log

      - name: Validate deployable site
        shell: bash
        run: |
          set -euxo pipefail
          for file in index.html life.mjs patterns.mjs toolbox.mjs radial.mjs; do
            test -s "$file" || { echo "ERROR: required site file missing or empty: $file"; exit 1; }
          done
          grep -q 'type="module"' index.html || { echo 'ERROR: index.html has no module script'; exit 1; }
          grep -q 'life.mjs' index.html || { echo 'ERROR: index.html does not import life.mjs'; exit 1; }
          grep -q 'toolbox.mjs' index.html || { echo 'ERROR: index.html does not import toolbox.mjs'; exit 1; }

      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          echo '## CI FAILED' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: ${{ github.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-output.log ]; then
            echo '### Test output' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 test-output.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Failure happened before unit-test output was produced. Open the first red step above.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Success summary
        if: success()
        shell: bash
        run: |
          echo '## CI PASSED' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit ${{ github.sha }} passed tests and deployable-site validation." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment failure summary
        if: failure()
        shell: bash
        run: |
          echo '## PAGES DEPLOY FAILED' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Open the first red deployment step above; its full error is preserved in the job log.' >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment success summary
        if: success()
        shell: bash
        run: |
          echo '## PAGES DEPLOYED' >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
